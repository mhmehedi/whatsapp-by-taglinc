[package]
name = "multi-whatsapp"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
muda = "0.21.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSBundle", "NSString"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.3"
wry = "0.57.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
