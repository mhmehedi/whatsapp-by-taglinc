[package]
name = "multi-whatsapp"
version = "0.1.4"
license = "MIT"
edition = "2024"

[dependencies]
getrandom = "0.3"
muda = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.3"
wry = "0.57.3"

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.23.1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSBundle", "NSString"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
