<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Multi Whatsapp by TagLinc — poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --jade-deep: #052a22;
    --jade: #0b4a3b;
    --mint: #8ff0c4;
    --gold: #ffd27a;
    --cream: #f3fff8;
    --ink: #0e2a24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; }
  body {
    font-family: "Hind Siliguri", sans-serif;
    color: var(--cream);
    background: var(--jade-deep);
    overflow: hidden;
  }
  .poster {
    position: relative;
    width: 1080px; height: 1080px;
    overflow: hidden;
    background:
      radial-gradient(620px 520px at 88% 6%, rgba(120, 240, 205, .30), transparent 70%),
      radial-gradient(700px 620px at 8% 92%, rgba(143, 240, 196, .34), transparent 70%),
      radial-gradient(900px 700px at 70% 80%, rgba(20, 120, 92, .55), transparent 72%),
      linear-gradient(160deg, #0d5a47 0%, var(--jade) 38%, var(--jade-deep) 100%);
  }
  /* soft aurora ribbons */
  .ribbon {
    position: absolute; border-radius: 50%;
    filter: blur(60px); opacity: .55; mix-blend-mode: screen;
  }
  .r1 { width: 900px; height: 180px; left: -120px; top: 330px; transform: rotate(-14deg);
        background: linear-gradient(90deg, transparent, rgba(143,240,196,.55), rgba(255,210,122,.45), transparent); }
  .r2 { width: 700px; height: 120px; right: -160px; top: 700px; transform: rotate(-20deg);
        background: linear-gradient(90deg, transparent, rgba(143,240,196,.45), transparent); }
  /* fine grain */
  .grain {
    position: absolute; inset: 0; opacity: .09; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- text ---------- */
  .brand {
    position: absolute; left: 72px; top: 64px;
    display: flex; align-items: baseline; gap: 14px;
  }
  .brand .name { font-size: 40px; font-weight: 700; letter-spacing: -.5px; }
  .brand .by { font-size: 26px; font-weight: 500; color: var(--gold); }

  .headline {
    position: absolute; left: 72px; top: 150px; width: 620px;
    font-size: 72px; line-height: 1.16; font-weight: 700; letter-spacing: -1px;
  }
  .sub {
    position: absolute; left: 74px; top: 418px; width: 410px;
    font-size: 27px; line-height: 1.5; font-weight: 400; color: rgba(243,255,248,.82);
  }

  .size {
    position: absolute; left: 72px; bottom: 150px;
    display: flex; align-items: flex-end; gap: 18px;
  }
  .size .num {
    font-size: 150px; line-height: .8; font-weight: 700; color: var(--gold);
    letter-spacing: -4px;
  }
  .size .unit { display: flex; flex-direction: column; padding-bottom: 6px; }
  .size .unit b { font-size: 46px; line-height: 1; font-weight: 700; color: var(--gold); }
  .size .unit span { font-size: 26px; line-height: 1.3; font-weight: 500; }

  .foot {
    position: absolute; left: 72px; right: 72px; bottom: 60px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 22px; font-weight: 500; color: rgba(243,255,248,.75);
  }
  .foot .pills { display: inline-flex; gap: 12px; }
  .foot .mac {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 9px 20px 7px; border-radius: 999px;
    border: 1.5px solid rgba(143,240,196,.5); color: var(--mint);
  }

  /* ---------- app window ---------- */
  .window {
    position: absolute; right: -150px; top: 450px;
    width: 700px; height: 500px; border-radius: 26px;
    background: rgba(250, 255, 252, .96);
    box-shadow: 0 50px 100px rgba(2, 20, 15, .55), 0 0 0 1px rgba(255,255,255,.35);
    transform: rotate(-6deg);
    overflow: hidden;
  }
  .bar { height: 44px; display: flex; align-items: center; gap: 9px; padding-left: 20px;
         background: #eef4f1; border-bottom: 1px solid #dfe8e3; }
  .bar i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .bar span { margin-left: 16px; font-size: 16px; font-weight: 600; color: #4a5f57; }

  .side { position: absolute; left: 0; top: 44px; bottom: 0; width: 96px;
          background: #e7efeb; display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 20px; }
  .list { position: absolute; left: 96px; top: 44px; bottom: 0; width: 230px;
          border-right: 1px solid #e3ebe7; padding: 22px 18px; }
  .row { display: flex; gap: 12px; align-items: center; margin-bottom: 22px; }
  .av { width: 42px; height: 42px; border-radius: 50%; flex: none; }
  .lines { flex: 1; }
  .lines i { display: block; height: 10px; border-radius: 6px; background: #d5e1db; margin: 5px 0; }
  .lines i:last-child { width: 70%; background: #e4ece8; }
  .chat { position: absolute; left: 326px; right: 0; top: 44px; bottom: 0; padding: 30px 26px;
          background: #f1f6f3; }
  .bub { max-width: 230px; padding: 12px 16px; border-radius: 16px; margin-bottom: 14px; }
  .bub i { display: block; height: 9px; border-radius: 5px; background: rgba(14,42,36,.18); margin: 5px 0; }
  .bub.in { background: #fff; }
  .bub.out { background: #c9f6dc; margin-left: auto; }

  /* account tiles (the product's own sidebar) */
  .tile {
    position: relative; width: 60px; height: 60px; border-radius: 17px;
    display: flex; align-items: center; justify-content: center;
    font-size: 27px; font-weight: 700; color: var(--ink);
    background: #fff; box-shadow: 0 3px 10px rgba(14,42,36,.12);
  }
  .tile.on { box-shadow: 0 0 0 3px #22c36a, 0 3px 10px rgba(14,42,36,.12); }
  .tile .badge {
    position: absolute; top: -8px; right: -8px; min-width: 24px; height: 24px; padding: 0 6px;
    border-radius: 12px; background: #e53935; color: #fff;
    font-size: 14px; font-weight: 700; line-height: 24px; text-align: center;
  }
  .tile img { display: block; }
  .tile img.fill { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: inherit; object-fit: cover; }
  .tile img.mark { width: 60%; height: 60%; object-fit: contain; }
  .tile .badge { z-index: 1; }
  .tile.img { background: transparent; }
  .tile.img img.fill { transform: translateZ(0); }
  .tile.add { color: #22c36a; font-size: 36px; font-weight: 500; }

  /* tiles spilling out of the window: "as many as you like" */
  .spill { position: absolute; display: flex; flex-direction: column; gap: 18px; }
  .spill .tile { width: 74px; height: 74px; border-radius: 21px; font-size: 32px;
                 box-shadow: 0 16px 34px rgba(2,20,15,.45); }
  .spill .tile .badge { min-width: 28px; height: 28px; line-height: 28px; font-size: 16px; border-radius: 14px; }
</style>
</head>
<body>
<div class="poster">
  <div class="ribbon r1"></div>
  <div class="ribbon r2"></div>

  <div class="brand"><span class="name">Multi Whatsapp</span><span class="by">by TagLinc</span></div>

  <h1 class="headline">যত খুশি WhatsApp<br>অ্যাকাউন্ট,<br>এক অ্যাপে</h1>

  <p class="sub">প্রতিটি অ্যাকাউন্ট আলাদা লগইনে, সবগুলো একসাথে খোলা থাকে।</p>

  <div class="window">
    <div class="bar"><i></i><i></i><i></i><span>Multi Whatsapp — TagLinc</span></div>
    <div class="side">
      <div class="tile img"><img class="fill" src="brand/flynode.png" alt="FlyNode"></div>
      <div class="tile img on"><img class="fill" src="brand/taglinc.png" alt="TagLinc"><span class="badge">5</span></div>
      <div class="tile img"><img class="fill" src="brand/dozehost.svg" alt="Doze Host"><span class="badge">2</span></div>
      <div class="tile img"><img class="fill" src="brand/hyperlink.png" alt="Hyperlink"></div>
      <div class="tile add">+</div>
    </div>
    <div class="list">
      <div class="row"><div class="av" style="background:#ffd27a"></div><div class="lines"><i></i><i></i></div></div>
      <div class="row"><div class="av" style="background:#8ff0c4"></div><div class="lines"><i></i><i></i></div></div>
      <div class="row"><div class="av" style="background:#b9d7ff"></div><div class="lines"><i></i><i></i></div></div>
      <div class="row"><div class="av" style="background:#ffc2b3"></div><div class="lines"><i></i><i></i></div></div>
      <div class="row"><div class="av" style="background:#d7c8ff"></div><div class="lines"><i></i><i></i></div></div>
    </div>
    <div class="chat">
      <div class="bub in"><i style="width:150px"></i><i style="width:110px"></i></div>
      <div class="bub out"><i style="width:170px"></i><i style="width:90px"></i></div>
      <div class="bub in"><i style="width:120px"></i></div>
      <div class="bub out"><i style="width:140px"></i><i style="width:160px"></i></div>
    </div>
  </div>

  <div class="spill" style="left: 700px; top: 300px; transform: rotate(-6deg);">
    <div class="tile img"><img class="fill" src="brand/hyperlink.png" alt="Hyperlink"></div>
  </div>
  <div class="spill" style="left: 800px; top: 190px; transform: rotate(-6deg);">
    <div class="tile img"><img class="fill" src="brand/dozehost.svg" alt="Doze Host"><span class="badge">9</span></div>
    <div class="tile img"><img class="fill" src="brand/taglinc.png" alt="TagLinc"></div>
  </div>
  <div class="spill" style="left: 880px; top: 56px; transform: rotate(-6deg);">
    <div class="tile img"><img class="fill" src="brand/flynode.png" alt="FlyNode"><span class="badge">1</span></div>
  </div>

  <div class="size">
    <div class="num">১</div>
    <div class="unit"><b>MB</b><span>মাত্র, একদম লাইটওয়েট</span></div>
  </div>

  <div class="foot">
    <span class="pills"><span class="mac">macOS</span><span class="mac">Windows</span></span>
    <span>Mac ও Windows, দুটোতেই চলে</span>
  </div>

  <div class="grain"></div>
</div>
</body>
</html>
